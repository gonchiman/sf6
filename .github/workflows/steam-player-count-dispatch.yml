name: Schedule Steam player count every 15 minutes
run-name: "Steam cadence ${{ inputs.mode || 'standard' }} / predecessor ${{ inputs.predecessor_run_id || 'none' }}"

on:
  schedule:
    - cron: '11 * * * *' # Recovery trigger if the dispatcher or its successor could not start.
  workflow_dispatch:
    inputs:
      mode:
        description: '通常取得、または2分で次の通常取得へ引き継ぐ検証'
        type: choice
        options: [standard, handoff-check]
        default: standard
      predecessor_run_id:
        description: '引き継ぎ元run ID（自動設定。手動起動では空欄）'
        type: string
        default: ''
      predecessor_run_attempt:
        description: '引き継ぎ元attempt（自動設定。手動起動では空欄）'
        type: string
        default: ''

permissions:
  contents: read

# One active dispatcher and at most one successor. Self-handoffs and recovery
# triggers share the same group and never interrupt the active clock.
concurrency:
  group: steam-player-count-dispatch-gonchiman-sf6
  cancel-in-progress: false
  queue: single

jobs:
  dispatch:
    if: github.repository == 'gonchiman/sf6' && github.ref == 'refs/heads/main' && github.event.repository.private == false && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 345
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout dispatcher code from this main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Test the clock and dispatch failures without network access
        run: node --test scripts/dispatch-steam-player-count.test.ts
      - name: Dispatch current observations and reserve the successor
        id: dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          STEAM_DISPATCH_MODE: ${{ inputs.mode || 'standard' }}
          STEAM_DISPATCH_PREDECESSOR_RUN_ID: ${{ inputs.predecessor_run_id }}
          STEAM_DISPATCH_PREDECESSOR_RUN_ATTEMPT: ${{ inputs.predecessor_run_attempt }}
        run: node scripts/dispatch-steam-player-count.ts
      - name: Confirm Steam successor reservation
        id: handoff-confirmed
        if: always() && !cancelled() && steps.dispatch.outputs.handoff == 'confirmed'
        env:
          SUCCESSOR_RUN_ID: ${{ steps.dispatch.outputs.successor_run_id }}
        run: echo "Confirmed successor run ${SUCCESSOR_RUN_ID}" >> "$GITHUB_STEP_SUMMARY"
