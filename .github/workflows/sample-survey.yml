name: Collect sample survey
run-name: ${{ inputs.source_sha != '' && format('Sample survey source {0}', inputs.source_sha) || 'Collect sample survey' }}

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: '取得・保存コードを固定する40桁SHA（空欄は実行時のmain）'
        required: false
        type: string
        default: ''
      resume_run_id:
        description: '暗号化した途中記録を引き継ぐ失敗実行ID（空欄は新規）'
        required: false
        type: string
        default: ''
      recover_authentication:
        description: '認証未確認で停止したLP記録を、認証再確認後に手動再開する'
        required: false
        type: boolean
        default: false
      resume_source_sha:
        description: '手動再開する途中記録の取得コードSHA（recover_authentication時のみ）'
        required: false
        type: string
        default: ''
      execution_budget_minutes:
        description: '今回の起動だけの取得時間上限（空欄は調査設定に従う）'
        required: false
        type: string
        default: ''
      ranks:
        description: 'LPランク（ROOKIE〜MASTER、カンマ区切り。MRのみなら空欄）'
        required: false
        type: string
        default: 'MASTER'
      rank_sample_size:
        description: '各LPランクの標本数（10〜1000、10刻み）'
        required: true
        type: number
        default: 10
      include_mr:
        description: '当期MRの6帯も取得（Act番号は未特定）'
        required: true
        type: boolean
        default: false
      mr_sample_size:
        description: '各MR帯の標本数（10〜1000、10刻み）'
        required: true
        type: number
        default: 10
      max_duration_minutes:
        description: '取得時間上限（LPあり1〜120分、MRのみ1〜180分、準備を含む）'
        required: true
        type: number
        default: 10

permissions:
  contents: read

# Share the collection lock with the existing rank and parallel-test workflows.
concurrency:
  group: rank-distribution-weekly-gonchiman-sf6
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'gonchiman/sf6' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: windows-2025
    timeout-minutes: ${{ inputs.ranks == '' && inputs.include_mr && 210 || 150 }}
    permissions:
      contents: read
      actions: read
    outputs:
      artifact_ready: ${{ steps.collect.outputs.artifact_ready }}
    env:
      SAMPLE_SURVEY_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
      SAMPLE_SURVEY_RESUME_RUN_ID: ${{ inputs.resume_run_id }}
      SAMPLE_SURVEY_RECOVER_AUTHENTICATION: ${{ inputs.recover_authentication }}
      SAMPLE_SURVEY_RESUME_SOURCE_SHA: ${{ inputs.resume_source_sha }}
      SAMPLE_SURVEY_EXECUTION_BUDGET_MINUTES: ${{ inputs.execution_budget_minutes }}
      SAMPLE_SURVEY_RANKS: ${{ inputs.ranks }}
      SAMPLE_SURVEY_RANK_SAMPLE_SIZE: ${{ inputs.rank_sample_size }}
      SAMPLE_SURVEY_INCLUDE_MR: ${{ inputs.include_mr }}
      SAMPLE_SURVEY_MR_SAMPLE_SIZE: ${{ inputs.mr_sample_size }}
      SAMPLE_SURVEY_MAX_DURATION_MINUTES: ${{ inputs.max_duration_minutes }}
    steps:
      - name: Validate collection source before checkout
        shell: pwsh
        env:
          SAMPLE_SURVEY_SOURCE_INPUT: ${{ inputs.source_sha }}
        run: |
          if ($env:GITHUB_SHA -cnotmatch '^[a-f0-9]{40}$' -or ($env:SAMPLE_SURVEY_SOURCE_INPUT -and $env:SAMPLE_SURVEY_SOURCE_INPUT -cnotmatch '^[a-f0-9]{40}$')) { throw 'Invalid collection source SHA' }
      - name: Checkout pinned collection source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify source trust from the running workflow
        shell: node {0}
        env:
          SAMPLE_SURVEY_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          const { execFileSync } = require('node:child_process');
          const source = process.env.SAMPLE_SURVEY_SOURCE_SHA, run = process.env.GITHUB_SHA;
          if (!/^[a-f0-9]{40}$/.test(source || '') || !/^[a-f0-9]{40}$/.test(run || '')) throw new Error('Invalid collection source SHA');
          const env = { ...process.env, GIT_TERMINAL_PROMPT: '0', GCM_INTERACTIVE: 'Never' };
          for (const key of Object.keys(env)) if (/token|secret|password|^BUCKLER_/i.test(key)) delete env[key];
          const git = (...args) => {
            try { return execFileSync('git', ['-c', 'credential.helper=', '-c', 'core.askPass=', ...args], {
              env, encoding: 'utf8', shell: false, windowsHide: true, timeout: 120000, maxBuffer: 65536, stdio: ['ignore', 'pipe', 'ignore'],
            }).trim(); } catch { throw new Error('Collection source trust check failed'); }
          };
          if (git('rev-parse', '--verify', 'HEAD') !== source) throw new Error('Collection source checkout mismatch');
          const file = '.github/workflows/sample-survey.yml';
          const sourceBlob = git('rev-parse', '--verify', `${source}:${file}`);
          if (source !== run) {
            git('fetch', '--no-tags', '--filter=blob:none', '--depth=1000', 'https://github.com/gonchiman/sf6.git', run);
            git('merge-base', '--is-ancestor', source, run);
            if (git('rev-parse', '--verify', `${run}:${file}`) !== sourceBlob) throw new Error('Collection workflow changed');
          }
      - name: Verify pinned source and workflow before session use
        id: source_verified
        env:
          SAMPLE_SURVEY_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: node scripts/lib/sample-survey-production-source.ts
      - name: Install dependencies without project scripts
        run: npm ci --ignore-scripts
      - name: Validate bounded inputs without session
        run: node --input-type=module -e "import {parseSampleSurveyCloudConfig,parseSampleSurveyExecutionBudget} from './scripts/collect-sample-survey-cloud.ts'; parseSampleSurveyExecutionBudget(process.env,parseSampleSurveyCloudConfig(process.env));"
      - name: Test collection and aggregate publication with synthetic data
        run: node --test scripts/collect-sample-survey-cloud.test.ts scripts/collect-sample-survey-resume.test.ts scripts/lib/sample-survey-publication.test.ts scripts/lib/sample-survey-runner.test.ts scripts/lib/sample-survey-browser.test.ts scripts/lib/sample-survey-diagnostics.test.ts scripts/lib/sample-survey-production-source.test.ts scripts/lib/sample-survey-cloud-checkpoint.test.ts scripts/prepare-sample-survey-checkpoint.test.ts
      - name: Download and verify the previous encrypted checkpoint
        if: inputs.resume_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-sample-survey-checkpoint.ts
      - name: Collect serial sample with saved session
        id: collect
        env:
          BUCKLER_WEEKLY_SESSION: ${{ secrets.BUCKLER_WEEKLY_SESSION }}
          SAMPLE_SURVEY_CHECKPOINT_KEY: ${{ secrets.SAMPLE_SURVEY_CHECKPOINT_KEY }}
        run: node scripts/collect-sample-survey-cloud.ts --collect
      - name: Finalize encrypted progress after collection
        id: finalize_checkpoint
        if: always() && steps.source_verified.outcome == 'success' && (steps.collect.outcome == 'success' || steps.collect.outcome == 'failure' || steps.collect.outcome == 'cancelled') && hashFiles('.local/sample-survey-cloud/checkpoint-output/checkpoint.enc.json') != ''
        run: node scripts/collect-sample-survey-cloud.ts --finalize-checkpoint
      - name: Save encrypted progress even when collection stopped
        if: always() && steps.source_verified.outcome == 'success' && steps.finalize_checkpoint.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sample-survey-checkpoint-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/sample-survey-cloud/checkpoint-output/checkpoint.enc.json
            .local/sample-survey-cloud/checkpoint-output/manifest.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Upload completed aggregate JSON only
        if: success() && steps.collect.outputs.artifact_ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sample-survey-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/sample-survey-cloud/output/public/data/sample-survey/index.json
            .local/sample-survey-cloud/output/public/data/sample-survey/runs/*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  save-history:
    if: needs.collect.result == 'success' && needs.collect.outputs.artifact_ready == 'true' && github.repository == 'gonchiman/sf6' && github.ref == 'refs/heads/main'
    needs: collect
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Validate publisher source before checkout
        shell: pwsh
        env:
          SAMPLE_SURVEY_SOURCE_INPUT: ${{ inputs.source_sha }}
        run: |
          if ($env:GITHUB_SHA -cnotmatch '^[a-f0-9]{40}$' -or ($env:SAMPLE_SURVEY_SOURCE_INPUT -and $env:SAMPLE_SURVEY_SOURCE_INPUT -cnotmatch '^[a-f0-9]{40}$')) { throw 'Invalid collection source SHA' }
      - name: Checkout publisher from pinned collection source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Verify source trust from the running workflow
        shell: node {0}
        env:
          SAMPLE_SURVEY_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: |
          const { execFileSync } = require('node:child_process');
          const source = process.env.SAMPLE_SURVEY_SOURCE_SHA, run = process.env.GITHUB_SHA;
          if (!/^[a-f0-9]{40}$/.test(source || '') || !/^[a-f0-9]{40}$/.test(run || '')) throw new Error('Invalid collection source SHA');
          const env = { ...process.env, GIT_TERMINAL_PROMPT: '0', GCM_INTERACTIVE: 'Never' };
          for (const key of Object.keys(env)) if (/token|secret|password|^BUCKLER_/i.test(key)) delete env[key];
          const git = (...args) => {
            try { return execFileSync('git', ['-c', 'credential.helper=', '-c', 'core.askPass=', ...args], {
              env, encoding: 'utf8', shell: false, windowsHide: true, timeout: 120000, maxBuffer: 65536, stdio: ['ignore', 'pipe', 'ignore'],
            }).trim(); } catch { throw new Error('Collection source trust check failed'); }
          };
          if (git('rev-parse', '--verify', 'HEAD') !== source) throw new Error('Collection source checkout mismatch');
          const file = '.github/workflows/sample-survey.yml';
          const sourceBlob = git('rev-parse', '--verify', `${source}:${file}`);
          if (source !== run) {
            git('fetch', '--no-tags', '--filter=blob:none', '--depth=1000', 'https://github.com/gonchiman/sf6.git', run);
            git('merge-base', '--is-ancestor', source, run);
            if (git('rev-parse', '--verify', `${run}:${file}`) !== sourceBlob) throw new Error('Collection workflow changed');
          }
      - name: Verify pinned source and workflow before history write
        env:
          SAMPLE_SURVEY_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
        run: node scripts/lib/sample-survey-production-source.ts
      - name: Prepare isolated aggregate history branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $historyPath = Join-Path $env:GITHUB_WORKSPACE '.local/sample-survey-cloud/history'
          New-Item -ItemType Directory -Path $historyPath -Force | Out-Null
          Set-Location -LiteralPath $historyPath
          git init --initial-branch=codex/sample-survey-history
          if ($LASTEXITCODE -ne 0) { throw 'Unable to initialize aggregate history' }
          git remote add origin https://github.com/gonchiman/sf6.git
          if ($LASTEXITCODE -ne 0) { throw 'Unable to set aggregate history remote' }
          $existingRef = git ls-remote --heads origin refs/heads/codex/sample-survey-history
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect aggregate history' }
          if ($existingRef) {
            git fetch --depth=1 origin refs/heads/codex/sample-survey-history
            if ($LASTEXITCODE -ne 0) { throw 'Unable to load aggregate history' }
            git reset --hard FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Unable to restore aggregate history' }
            $trackedPaths = git ls-tree -r --name-only HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Unable to validate aggregate history paths' }
            foreach ($trackedPath in $trackedPaths) {
              if ($trackedPath -cnotmatch '^public/data/sample-survey/(index\.json|runs/[A-Za-z0-9][A-Za-z0-9_-]{0,79}\.json)$') { throw 'Unexpected history file' }
            }
          }
      - name: Download this run's completed aggregates
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sample-survey-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/sample-survey-cloud/incoming/public/data/sample-survey
          digest-mismatch: error
      - name: Validate and merge immutable aggregate history
        run: node scripts/publish-sample-survey-cloud.ts
      - name: Save aggregate history
        working-directory: .local/sample-survey-cloud/history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git branch --show-current) -ne 'codex/sample-survey-history') { throw 'Unexpected history branch' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/data/sample-survey
          if ($LASTEXITCODE -ne 0) { throw 'Unable to stage aggregate history' }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($LASTEXITCODE -ne 1) { throw 'Unable to compare aggregate history' }
          git commit -m 'Save completed sample survey aggregates'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to commit aggregate history' }
          $credential = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:GH_TOKEN"))
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $credential"
          try {
            git push origin HEAD:refs/heads/codex/sample-survey-history
            if ($LASTEXITCODE -ne 0) { throw 'Unable to save aggregate history' }
          } finally {
            Remove-Item Env:GIT_CONFIG_COUNT, Env:GIT_CONFIG_KEY_0, Env:GIT_CONFIG_VALUE_0
            $credential = $null
          }
