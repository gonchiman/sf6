name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: 'GitHub Pagesへ公開する（手動実行時）'
        required: false
        type: boolean
        default: false
      buckler_probe:
        description: '検証専用ブランチでBucklerの取得検証を手動実行する'
        required: false
        type: choice
        options: ['off', 'anonymous', 'saved-session', 'rank-distribution']
        default: 'off'
      buckler_headless:
        description: 'Buckler検証を画面なしで実行する（既定は表示付きEdge）'
        required: false
        type: boolean
        default: false
      buckler_rank_resume:
        description: 'ランク分布の保存位置を探索ヒントとして使う（全境界を新しく確認）'
        required: false
        type: boolean
        default: false
      buckler_rank_checkpoint:
        description: 'ランク分布のcheckpoint JSON（認証情報を含めない）'
        required: false
        type: string
        default: ''
      buckler_rank_max_requests:
        description: 'ランク分布の読み取り回数上限（2〜1000）'
        required: false
        type: string
        default: '600'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ inputs.buckler_probe == 'rank-distribution' && '-rank-distribution' || '' }}
  cancel-in-progress: ${{ inputs.buckler_probe != 'rank-distribution' }}

jobs:
  buckler-rank-distribution:
    if: github.event_name == 'workflow_dispatch' && inputs.buckler_probe == 'rank-distribution' && github.repository == 'gonchiman/sf6' && startsWith(github.ref, 'refs/heads/codex/buckler-cloud-collection')
    permissions:
      contents: read
    uses: ./.github/workflows/rank-distribution-cloud-probe.yml
    with:
      collection: saved-session
      resume: ${{ inputs.buckler_rank_resume }}
      max_requests: ${{ inputs.buckler_rank_max_requests }}
      checkpoint_json: ${{ inputs.buckler_rank_checkpoint }}
    secrets:
      BUCKLER_CLOUD_PROBE_SESSION: ${{ secrets.BUCKLER_CLOUD_PROBE_SESSION }}

  build:
    if: github.event_name != 'workflow_dispatch' || inputs.buckler_probe == 'off'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Set up GitHub Pages
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_pages))
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_pages))
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./dist

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy_pages))
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  buckler-cloud-probe:
    if: github.event_name == 'workflow_dispatch' && (inputs.buckler_probe == 'anonymous' || inputs.buckler_probe == 'saved-session') && startsWith(github.ref, 'refs/heads/codex/buckler-cloud-probe')
    runs-on: windows-2025
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - name: Checkout probe branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies without project scripts
        run: npm ci --ignore-scripts
      - name: Test probe with synthetic state
        run: node --test scripts/probe-buckler-cloud.test.ts
      - name: Probe fixed ranking page once
        shell: pwsh
        env:
          BUCKLER_CLOUD_PROBE_SESSION: ${{ inputs.buckler_probe == 'saved-session' && secrets.BUCKLER_CLOUD_PROBE_SESSION || '' }}
          BUCKLER_PROBE_MODE: ${{ inputs.buckler_probe }}
          BUCKLER_PROBE_HEADLESS: ${{ inputs.buckler_headless }}
        run: |
          $probeArguments = @('--anonymous')
          if ($env:BUCKLER_PROBE_MODE -eq 'saved-session') { $probeArguments = @('--saved-session') }
          if ($env:BUCKLER_PROBE_HEADLESS -eq 'true') { $probeArguments += '--headless' }
          node scripts/probe-buckler-cloud.ts @probeArguments
