name: Collect Steam player count

on:
  schedule:
    - cron: '7,22,37,52 * * * *' # Every 15 minutes, away from the busy start of the hour (UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    if: github.repository == 'gonchiman/sf6' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.artifact-name.outputs.name }}
    steps:
      - name: Checkout collection code from this main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Test collection with synthetic responses
        run: node --test scripts/collect-steam-player-count.test.ts
      - name: Collect one current Steam player count
        run: node scripts/collect-steam-player-count.ts --collect --output .local/steam-player-count/output
      - name: Preserve this collection attempt's artifact name for publisher retries
        id: artifact-name
        run: echo "name=steam-player-count-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - name: Upload the validated observation only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: .local/steam-player-count/output/observation.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  save-history:
    needs: collect
    if: github.repository == 'gonchiman/sf6' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # Collection remains independent; only generated-history writers wait for each other.
    concurrency:
      group: steam-player-count-history-gonchiman-sf6
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout publisher code from this main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Test publication using temporary local data
        run: node --test scripts/publish-steam-player-count.test.ts scripts/publish-steam-player-count-history.test.ts
      - name: Download this run's validated observation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.collect.outputs.artifact_name }}
          path: .local/steam-player-count/incoming
          digest-mismatch: error
      - name: Merge and save only the isolated Steam history branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-steam-player-count-history.ts
