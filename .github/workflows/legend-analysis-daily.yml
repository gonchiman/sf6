name: Collect daily Legend analysis

on:
  schedule:
    - cron: '15 20 * * *' # Every day at 05:15 Asia/Tokyo (20:15 UTC on the previous day)
  workflow_dispatch:
    inputs:
      include_players:
        description: Save the verified Legend player list as well as aggregates
        type: boolean
        required: true
        default: false

env:
  LEGEND_PLAYERS_ENABLED: ${{ (github.event_name == 'workflow_dispatch' && inputs.include_players) || (github.event_name == 'schedule' && vars.LEGEND_PLAYERS_DAILY_ENABLED == 'true') }}

permissions:
  contents: read

concurrency:
  group: legend-analysis-daily-gonchiman-sf6
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'gonchiman/sf6' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: windows-2025
    timeout-minutes: ${{ ((github.event_name == 'workflow_dispatch' && inputs.include_players) || (github.event_name == 'schedule' && vars.LEGEND_PLAYERS_DAILY_ENABLED == 'true')) && 130 || 20 }}
    permissions:
      contents: read
    outputs:
      artifact_ready: ${{ steps.collect.outputs.artifact_ready }}
      collection_result: ${{ steps.collect.outputs.collection_result }}
      collection_outcome: ${{ steps.collect.outcome }}
      collection_attempt: ${{ steps.start.outputs.attempt }}
      started_at: ${{ steps.start.outputs.started_at }}
      ended_at: ${{ steps.finish.outputs.ended_at }}
    steps:
      - name: Record collection job start
        id: start
        shell: pwsh
        run: |
          $time = [DateTime]::UtcNow.ToString("yyyy-MM-dd'T'HH:mm:ss.fff'Z'", [Globalization.CultureInfo]::InvariantCulture)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value @("started_at=$time", "attempt=$env:GITHUB_RUN_ATTEMPT") -Encoding utf8
      - name: Checkout collection code from this main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies without project scripts
        run: npm ci --ignore-scripts
      - name: Test collection with synthetic data
        run: npm run test:legend-analysis
      - name: Collect Legend entries using existing saved session
        id: collect
        env:
          BUCKLER_WEEKLY_SESSION: ${{ secrets.BUCKLER_WEEKLY_SESSION }}
          LEGEND_COLLECTION_STARTED_AT: ${{ steps.start.outputs.started_at }}
        run: node scripts/collect-legend-analysis-daily.ts --collect
      - name: Upload validated aggregate and optional player JSON only
        if: always() && steps.collect.outputs.artifact_ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legend-analysis-daily-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/legend-analysis-daily/output/public/index.json
            .local/legend-analysis-daily/output/public/legend-*.json
            .local/legend-analysis-daily/output/public/players/index.json
            .local/legend-analysis-daily/output/public/players/legend-*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - name: Record collection job end
        if: always()
        id: finish
        shell: pwsh
        run: |
          $time = [DateTime]::UtcNow.ToString("yyyy-MM-dd'T'HH:mm:ss.fff'Z'", [Globalization.CultureInfo]::InvariantCulture)
          Add-Content -LiteralPath $env:GITHUB_OUTPUT -Value "ended_at=$time" -Encoding utf8

  save-history:
    if: always() && needs.collect.outputs.artifact_ready == 'true' && github.repository == 'gonchiman/sf6' && github.ref == 'refs/heads/main'
    needs: collect
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      save_outcome: ${{ steps.save.outcome }}
    steps:
      - name: Checkout publisher code from this main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Prepare isolated aggregate history branch
        shell: pwsh
        run: ./scripts/legend-analysis-history-git.ps1 -Action prepare
      - name: Download this run's validated JSON
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: legend-analysis-daily-${{ github.run_id }}-${{ needs.collect.outputs.collection_attempt }}
          path: .local/legend-analysis-daily/incoming/public
          digest-mismatch: error
      - name: Validate and merge immutable aggregate and player history
        run: node scripts/publish-legend-analysis-daily.ts
      - name: Save aggregate history
        id: save
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: ./scripts/legend-analysis-history-git.ps1 -Action save-data

  record-result:
    if: always() && github.repository == 'gonchiman/sf6' && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.include_players) || (github.event_name == 'schedule' && vars.LEGEND_PLAYERS_DAILY_ENABLED == 'true'))
    needs: [collect, save-history]
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout recording code from this main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Prepare isolated result history branch
        shell: pwsh
        run: ./scripts/legend-analysis-history-git.ps1 -Action prepare
      - name: Record the collection and data publication outcome
        env:
          LEGEND_COLLECTION_RESULT: ${{ needs.collect.outputs.collection_result }}
          LEGEND_COLLECTION_ATTEMPT: ${{ needs.collect.outputs.collection_attempt }}
          LEGEND_COLLECTION_STARTED_AT: ${{ needs.collect.outputs.started_at }}
          LEGEND_COLLECTION_ENDED_AT: ${{ needs.collect.outputs.ended_at }}
          LEGEND_ARTIFACT_READY: ${{ needs.collect.outputs.artifact_ready }}
          LEGEND_COLLECT_STEP_OUTCOME: ${{ needs.collect.outputs.collection_outcome }}
          LEGEND_COLLECT_JOB_RESULT: ${{ needs.collect.result }}
          LEGEND_SAVE_JOB_RESULT: ${{ needs.save-history.outputs.save_outcome || needs.save-history.result }}
        run: node scripts/record-legend-analysis-daily.ts
      - name: Save result history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: ./scripts/legend-analysis-history-git.ps1 -Action save-result
