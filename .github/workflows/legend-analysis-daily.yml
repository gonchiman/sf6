name: Collect daily Legend analysis

on:
  schedule:
    - cron: '45 13 * * *' # Every day at 22:45 Asia/Tokyo
  workflow_dispatch:
    inputs:
      include_players:
        description: Save the verified Legend player list as well as aggregates
        type: boolean
        required: true
        default: false

env:
  LEGEND_PLAYERS_ENABLED: ${{ (github.event_name == 'workflow_dispatch' && inputs.include_players) || (github.event_name == 'schedule' && vars.LEGEND_PLAYERS_DAILY_ENABLED == 'true') }}

permissions:
  contents: read

concurrency:
  group: legend-analysis-daily-gonchiman-sf6
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'gonchiman/sf6' && github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      artifact_ready: ${{ steps.collect.outputs.artifact_ready }}
    steps:
      - name: Checkout collection code from this main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies without project scripts
        run: npm ci --ignore-scripts
      - name: Test collection with synthetic data
        run: npm run test:legend-analysis
      - name: Collect Legend entries using existing saved session
        id: collect
        env:
          BUCKLER_WEEKLY_SESSION: ${{ secrets.BUCKLER_WEEKLY_SESSION }}
        run: node scripts/collect-legend-analysis-daily.ts --collect
      - name: Upload validated aggregate and optional player JSON only
        if: always() && steps.collect.outputs.artifact_ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: legend-analysis-daily-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/legend-analysis-daily/output/public/index.json
            .local/legend-analysis-daily/output/public/legend-*.json
            .local/legend-analysis-daily/output/public/players/index.json
            .local/legend-analysis-daily/output/public/players/legend-*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  save-history:
    if: always() && needs.collect.outputs.artifact_ready == 'true' && github.repository == 'gonchiman/sf6' && github.ref == 'refs/heads/main'
    needs: collect
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout publisher code from this main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Prepare isolated aggregate history branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $historyPath = Join-Path $env:GITHUB_WORKSPACE '.local/legend-analysis-daily/history'
          New-Item -ItemType Directory -Path $historyPath -Force | Out-Null
          Set-Location -LiteralPath $historyPath
          git init --initial-branch=codex/legend-analysis-history
          if ($LASTEXITCODE -ne 0) { throw 'Unable to initialize aggregate history' }
          git remote add origin https://github.com/gonchiman/sf6.git
          if ($LASTEXITCODE -ne 0) { throw 'Unable to set aggregate history remote' }
          $existingRef = git ls-remote --heads origin refs/heads/codex/legend-analysis-history
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect aggregate history' }
          if ($existingRef) {
            git fetch --depth=1 origin refs/heads/codex/legend-analysis-history
            if ($LASTEXITCODE -ne 0) { throw 'Unable to load aggregate history' }
            git reset --hard FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Unable to restore aggregate history' }
          }
      - name: Download this run's validated JSON
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: legend-analysis-daily-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/legend-analysis-daily/incoming/public
          digest-mismatch: error
      - name: Validate and merge immutable aggregate and player history
        run: node scripts/publish-legend-analysis-daily.ts
      - name: Save aggregate history
        working-directory: .local/legend-analysis-daily/history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git branch --show-current) -ne 'codex/legend-analysis-history') { throw 'Unexpected history branch' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public
          if ($LASTEXITCODE -ne 0) { throw 'Unable to stage aggregate history' }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($LASTEXITCODE -ne 1) { throw 'Unable to compare aggregate history' }
          git commit -m 'Save daily Legend analysis'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to commit aggregate history' }
          $credential = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:GH_TOKEN"))
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $credential"
          try {
            git push origin HEAD:refs/heads/codex/legend-analysis-history
            if ($LASTEXITCODE -ne 0) { throw 'Unable to save aggregate history' }
          } finally {
            Remove-Item Env:GIT_CONFIG_COUNT, Env:GIT_CONFIG_KEY_0, Env:GIT_CONFIG_VALUE_0
            $credential = $null
          }
