name: Collect daily MR distribution

on:
  workflow_call:
    secrets:
      BUCKLER_WEEKLY_SESSION:
        required: true
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mr-distribution-weekly-gonchiman-sf6
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'gonchiman/sf6' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && vars.MR_DISTRIBUTION_WEEKLY_ENABLED == 'true'))
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: read
    outputs:
      artifact_ready: ${{ steps.collect.outputs.artifact_ready }}
    steps:
      - name: Checkout collection code from this main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies without project scripts
        run: npm ci --ignore-scripts
      - name: Test collection and publication with synthetic data
        run: npm run test:mr-distribution
      - name: Collect fresh MR boundaries using the existing saved session
        id: collect
        env:
          BUCKLER_WEEKLY_SESSION: ${{ secrets.BUCKLER_WEEKLY_SESSION }}
        run: node scripts/collect-mr-distribution-weekly.ts --collect
      - name: Upload validated aggregate JSON and safe run record only
        if: always() && steps.collect.outputs.artifact_ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mr-distribution-weekly-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .local/mr-distribution-weekly/output/public/index.json
            .local/mr-distribution-weekly/output/public/max-mr-*.json
            .local/mr-distribution-weekly/output/runs/run-*.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90

  save-history:
    if: always() && needs.collect.outputs.artifact_ready == 'true' && github.repository == 'gonchiman/sf6' && github.ref == 'refs/heads/main'
    needs: collect
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout publisher code from this main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Prepare isolated aggregate history branch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $historyPath = Join-Path $env:GITHUB_WORKSPACE '.local/mr-distribution-weekly/history'
          New-Item -ItemType Directory -Path $historyPath -Force | Out-Null
          Set-Location -LiteralPath $historyPath
          git init --initial-branch=codex/mr-distribution-history
          if ($LASTEXITCODE -ne 0) { throw 'Unable to initialize MR history' }
          git remote add origin https://github.com/gonchiman/sf6.git
          if ($LASTEXITCODE -ne 0) { throw 'Unable to set MR history remote' }
          $existingRef = git ls-remote --heads origin refs/heads/codex/mr-distribution-history
          if ($LASTEXITCODE -ne 0) { throw 'Unable to inspect MR history' }
          if ($existingRef) {
            git fetch --depth=1 origin refs/heads/codex/mr-distribution-history
            if ($LASTEXITCODE -ne 0) { throw 'Unable to load MR history' }
            git checkout -B codex/mr-distribution-history FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Unable to restore MR history' }
          }
      - name: Download this run's validated aggregate output
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mr-distribution-weekly-${{ github.run_id }}-${{ github.run_attempt }}
          path: .local/mr-distribution-weekly/incoming
          digest-mismatch: error
      - name: Validate and merge immutable MR aggregate history
        run: node scripts/publish-mr-distribution-weekly.ts
      - name: Save aggregate history and safe run record
        working-directory: .local/mr-distribution-weekly/history
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git branch --show-current) -ne 'codex/mr-distribution-history') { throw 'Unexpected MR history branch' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public runs
          if ($LASTEXITCODE -ne 0) { throw 'Unable to stage MR history' }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($LASTEXITCODE -ne 1) { throw 'Unable to compare MR history' }
          git commit -m 'Save weekly MR distribution'
          if ($LASTEXITCODE -ne 0) { throw 'Unable to commit MR history' }
          $credential = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:GH_TOKEN"))
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = 'http.https://github.com/.extraheader'
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $credential"
          try {
            git push origin HEAD:refs/heads/codex/mr-distribution-history
            if ($LASTEXITCODE -ne 0) { throw 'Unable to save MR history' }
          } finally {
            Remove-Item Env:GIT_CONFIG_COUNT, Env:GIT_CONFIG_KEY_0, Env:GIT_CONFIG_VALUE_0
            $credential = $null
          }
