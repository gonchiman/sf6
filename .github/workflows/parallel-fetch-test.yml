name: Parallel fetch test
run-name: Parallel fetch ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'LPランキングの小規模取得条件'
        required: true
        type: choice
        options: ['serial', 'compare', 'interval-compare']
        default: 'serial'
      intervals:
        description: '間隔比較の開始間隔（ミリ秒、長い順）'
        required: true
        type: choice
        options: ['10000', '5000', '3000', '10000,5000', '10000,3000', '5000,3000', '10000,5000,3000']
        default: '5000,3000'
      concurrencies:
        description: '間隔比較の並列数（1〜8、1必須、カンマ区切り）'
        required: true
        type: string
        default: '1,2'
      repetitions:
        description: '間隔比較の各条件の反復回数'
        required: true
        type: choice
        options: ['1', '3']
        default: '1'
      request_id:
        description: 'アプリが発行する小文字のUUID v4'
        required: true
        type: string

permissions:
  contents: read

# Share the collection lock with weekly rank distribution and the earlier test.
concurrency:
  group: rank-distribution-weekly-gonchiman-sf6
  cancel-in-progress: false

jobs:
  test:
    if: github.repository == 'gonchiman/sf6' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 18
    permissions:
      contents: read
    env:
      PARALLEL_TEST_MODE: ${{ inputs.mode }}
      PARALLEL_TEST_INTERVALS: ${{ inputs.intervals }}
      PARALLEL_TEST_CONCURRENCIES: ${{ inputs.concurrencies }}
      PARALLEL_TEST_REPETITIONS: ${{ inputs.repetitions }}
      PARALLEL_FETCH_REQUEST_ID: ${{ inputs.request_id }}
    steps:
      - name: Validate fixed test inputs
        shell: pwsh
        run: |
          if ($env:PARALLEL_TEST_MODE -cnotin @('serial', 'compare', 'interval-compare')) { throw 'Invalid test mode' }
          if ($env:PARALLEL_TEST_MODE -ceq 'interval-compare') {
            if ($env:PARALLEL_TEST_INTERVALS -cnotin @('10000', '5000', '3000', '10000,5000', '10000,3000', '5000,3000', '10000,5000,3000')) { throw 'Invalid intervals' }
            if ($env:PARALLEL_TEST_REPETITIONS -cnotin @('1', '3')) { throw 'Invalid repetitions' }
          }
          if ($env:PARALLEL_FETCH_REQUEST_ID.Length -ne 36 -or $env:PARALLEL_FETCH_REQUEST_ID -cnotmatch '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$') { throw 'Invalid request ID' }
          if ($env:GITHUB_SHA.Length -ne 40 -or $env:GITHUB_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid source revision' }
      - name: Checkout dispatched source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Immutable SHA selected at dispatch; never resolve a moving main again.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify checked out source revision
        shell: pwsh
        run: |
          $checkedOutRevision = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $checkedOutRevision -cne $env:GITHUB_SHA) { throw 'Unexpected source revision' }
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install dependencies without project scripts
        run: npm ci --ignore-scripts
      - name: Validate combined test budget without session
        shell: pwsh
        run: |
          node --input-type=module -e "import {parseParallelFetchCloudArguments} from './scripts/test-parallel-fetch-cloud.ts'; const e=process.env; parseParallelFetchCloudArguments(e.PARALLEL_TEST_MODE==='interval-compare' ? ['--interval-compare','--intervals='+e.PARALLEL_TEST_INTERVALS,'--concurrencies='+e.PARALLEL_TEST_CONCURRENCIES,'--repetitions='+e.PARALLEL_TEST_REPETITIONS] : ['--'+e.PARALLEL_TEST_MODE]);"
      - name: Test bounded collection with synthetic state
        run: node --test src/lib/parallelFetch.test.ts scripts/lib/parallel-fetch-runner.test.ts scripts/lib/parallel-fetch-browser.test.ts scripts/lib/parallel-fetch-service.test.ts scripts/test-parallel-fetch-cloud.test.ts
      - name: Run bounded collection test
        id: collect
        shell: pwsh
        env:
          BUCKLER_WEEKLY_SESSION: ${{ secrets.BUCKLER_WEEKLY_SESSION }}
        run: |
          if ($env:PARALLEL_TEST_MODE -ceq 'interval-compare') {
            node scripts/test-parallel-fetch-cloud.ts --interval-compare "--intervals=$env:PARALLEL_TEST_INTERVALS" "--concurrencies=$env:PARALLEL_TEST_CONCURRENCIES" "--repetitions=$env:PARALLEL_TEST_REPETITIONS"
          } else {
            node scripts/test-parallel-fetch-cloud.ts "--$env:PARALLEL_TEST_MODE"
          }
      - name: Upload this run's validated report only
        if: always() && steps.collect.outputs.artifact_ready == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parallel-fetch-cloud-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.PARALLEL_TEST_MODE }}
          path: .local/parallel-fetch/parallel-fetch-cloud-${{ github.run_id }}-${{ github.run_attempt }}-${{ env.PARALLEL_TEST_MODE }}.json
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
