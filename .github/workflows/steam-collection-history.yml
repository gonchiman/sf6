name: Reconcile Steam collection history

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reconcile:
    if: github.repository == 'gonchiman/sf6' && github.ref == 'refs/heads/main' && github.event.repository.private == false && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    concurrency:
      group: steam-player-count-history-gonchiman-sf6
      cancel-in-progress: false
      queue: max
    steps:
      - name: Checkout reconciliation code from this main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Reconcile collection results and save the isolated history branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/reconcile-steam-collection-history.ts
